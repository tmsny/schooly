name: Syntax Check & Smoke Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: JavaScript-Syntax prüfen
        run: git ls-files -z '*.js' | xargs -0 -r -n 1 node --check

      - name: Smoke-Test ausführen
        run: npm test
